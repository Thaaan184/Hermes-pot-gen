# AI Design Studio — Single-Origin Nginx Edge
# Serves dashboard at /studio/, proxies Penpot at /, proxies studio-api at /studio-api/
# All on one origin so auth cookies and XHR work without CORS.

upstream penpot_frontend {
    server penpot-frontend:8080;
    keepalive 32;
}

upstream studio_api {
    server studio-api:4000;
    keepalive 16;
}

upstream studio_web {
    server studio-web:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 350m;
    proxy_http_version 1.1;

    # ── Studio Dashboard ───────────────────────────────────────────────────────
    # Served by studio-web static server
    location /studio/ {
        proxy_pass http://studio_web/studio/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    # Root redirect -> studio dashboard
    location = / {
        return 302 /studio/;
    }

    # ── Studio API ─────────────────────────────────────────────────────────────
    location /studio-api/ {
        proxy_pass http://studio_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE support (for /api/chat)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── Internal Auth Subrequest ───────────────────────────────────────────────
    # Used by auth_request directive (internal only)
    location = /internal/auth {
        internal;
        proxy_pass http://studio_api/internal/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # ── Penpot Frontend (editor + assets) ─────────────────────────────────────
    # Inject whitelabel CSS and AI Copilot script into every HTML page
    location / {
        # Disable gzip so sub_filter can work
        proxy_set_header Accept-Encoding "";

        proxy_pass http://penpot_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;

        # WebSocket support (Penpot uses WS for real-time sync)
        proxy_read_timeout 86400s;

        # Inject AI Copilot script and whitelabel CSS before </head>
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '</head>'
            '<link rel="stylesheet" href="/studio/whitelabel.css">'
            '<script src="/studio/inject.js"></script>'
            '</head>';
    }

    # ── Static: whitelabel assets served from studio-web ──────────────────────
    location ~ ^/studio/(inject\.js|whitelabel\.css)$ {
        proxy_pass http://studio_web;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
