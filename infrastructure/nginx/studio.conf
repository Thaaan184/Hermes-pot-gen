# AI Design Studio — Single-Origin Nginx Edge
# Clean Zero-Based Architecture: Single-origin edge reverse proxy.
# Serves dashboard at /studio/, canvas trampoline at /studio/canvas/,
# proxies studio-api at /studio-api/, and mounts Studio Shell over Penpot workspace at root.

upstream penpot_frontend {
    server penpot-frontend:8080;
    keepalive 32;
}

upstream studio_api {
    server studio-api:4000;
    keepalive 16;
}

upstream studio_web {
    server studio-web:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 350m;
    proxy_http_version 1.1;

    port_in_redirect off;
    absolute_redirect off;

    # ── Root Redirect ──────────────────────────────────────────────────────────
    # User entry defaults to Studio Dashboard
    location = / {
        return 302 /studio/;
    }

    # ── Studio Dashboard & Static Assets ───────────────────────────────────────
    # Served by studio-web static server
    location /studio/ {
        proxy_pass http://studio_web/studio/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    # ── Studio Canvas Launcher ─────────────────────────────────────────────────
    # Directly serves trampoline.html with auth cookie verification
    location /studio/canvas/ {
        auth_request /internal/auth;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie always;

        rewrite ^/studio/canvas/.*$ /studio/trampoline.html break;
        proxy_pass http://studio_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    # ── Studio API ─────────────────────────────────────────────────────────────
    location /studio-api/ {
        proxy_pass http://studio_api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE support (for /api/chat)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── Internal Auth Subrequest ───────────────────────────────────────────────
    location = /internal/auth {
        internal;
        proxy_pass http://studio_api/internal/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # ── Penpot Frontend Runtime & APIs (Assets, /api/, /ws/, etc.) ─────────────
    # Proxies to penpot-frontend, attaching Studio Shell overlay on HTML documents
    location / {
        proxy_pass http://penpot_frontend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;

        proxy_read_timeout 86400s;

        # Inject Studio Shell overlay only on HTML documents
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/studio/whitelabel.css"><script src="/studio/studio-shell.js" defer></script></head>';
    }
}
